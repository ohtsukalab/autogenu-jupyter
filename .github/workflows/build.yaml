name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CMake 4 and test dependencies
        run: python -m pip install --upgrade pip "cmake>=4,<5" ".[test]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run unit and end-to-end tests
        run: python -m pytest -v

  cpp-examples:
    name: C++ examples / CMake 4
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CMake 4
        run: python -m pip install "cmake>=4,<5"

      - name: Configure cgmres package
        run: cmake -S . -B build

      - name: Build C++ examples
        shell: bash
        run: |
          set -euo pipefail
          for example in cartpole cartpole_external_reference hexacopter mobilerobot pendubot; do
            cmake -S "examples/cpp/${example}" -B "build/examples/${example}" -Dcgmres_DIR="${PWD}/build"
            cmake --build "build/examples/${example}" --parallel 2
          done
