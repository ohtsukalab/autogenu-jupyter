name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-quality:
    name: Package quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package quality tools
        run: python -m pip install --upgrade pip ".[quality]"

      - name: Run Ruff
        run: python -m ruff check autogenu tests

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify wheel contents and isolated installation
        run: python tests/verify_wheel.py dist

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  e2e:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CMake 4 and test dependencies
        run: python -m pip install --upgrade pip "cmake>=4,<5" ".[test,plot]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run unit and end-to-end tests
        run: python -m pytest -v

  cpp-examples:
    name: C++ examples / warnings as errors / CMake 4
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CMake 4
        run: python -m pip install "cmake>=4,<5"

      - name: Configure cgmres package
        run: cmake -S . -B build -DCGMRES_WARNINGS_AS_ERRORS=ON

      - name: Build C++ examples
        shell: bash
        run: |
          set -euo pipefail
          for example in cartpole cartpole_external_reference hexacopter mobilerobot pendubot; do
            cmake -S "examples/cpp/${example}" -B "build/examples/${example}" -Dcgmres_DIR="${PWD}/build"
            cmake --build "build/examples/${example}" --parallel 2
          done

  static-analysis:
    name: clang-tidy static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install --yes clang-tidy-18

      - name: Configure cgmres package
        run: cmake -S . -B build/static-analysis/package

      - name: Configure analysis target
        run: >-
          cmake -S examples/cpp/cartpole -B build/static-analysis/cartpole
          -Dcgmres_DIR="${PWD}/build/static-analysis/package"
          -DVECTORIZE=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_CLANG_TIDY="clang-tidy-18;--warnings-as-errors=*"

      - name: Build with clang-tidy
        run: cmake --build build/static-analysis/cartpole --parallel 2

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CMake 4 and test dependencies
        run: python -m pip install --upgrade pip "cmake>=4,<5" ".[test]"

      - name: Run generated-code sanitizer test
        env:
          CGMRES_RUN_SANITIZERS: "1"
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: python -m pytest -v tests/test_sanitizers.py
